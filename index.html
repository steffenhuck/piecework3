<style>
/* Layout: a jigsaw table for Piecework. Two slim control rows, then one canvas filling the rest of the screen: the frame on top (or left, on wide screens) and loose pieces on the felt. Deliberately single-theme: a dark table makes every picture read. Blackboards Edition: same engine as Cityscapes and Flowers, chalk painter, chalk-blue accent. */

}

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: color-mix(in oklab, var(--felt) 50%, var(--bg)); }

<script>
const W = 1000, H = 750;
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, n >> 8 & 255, n & 255]; }
function hexA(hex, a) { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; }
function mix(a, b, t) { const x = rgb(a), y = rgb(b); return '#' + x.map((v, i) => Math.max(0, Math.min(255, Math.round(v + (y[i] - v) * t))).toString(16).padStart(2, '0')).join(''); }
function shade(hex, f) { return mix(hex, f < 1 ? '#000000' : '#ffffff', f < 1 ? 1 - f : f - 1); }

const FONT = '"Klee One", "Caveat", "Segoe Print", "Comic Sans MS", cursive';

// ---------- a tiny TeX-like reader: \frac{}{} \sqrt{} \int_{}^{} \sum_{}^{} \lim_{} \bar{} \dot{} ^{} _{} ----------
function parse(s) {
  let i = 0;
  function group() {
    if (s[i] === '{') { i++; const it = seq('}'); i++; return it; }
    const ch = s[i++]; return [ch];
  }
  function seq(end) {
    const out = []; let txt = '';
    const flush = () => { if (txt) { out.push(txt); txt = ''; } };
    while (i < s.length && s[i] !== end) {
      const c = s[i];
      if (c === '\\') {
        let j = i + 1; while (j < s.length && /[a-z]/.test(s[j])) j++;
        const cmd = s.slice(i + 1, j); i = j; flush();
        if (cmd === 'frac') { const a = group(), b = group(); out.push({ k: 'frac', a, b }); }
        else if (cmd === 'sqrt' || cmd === 'bar' || cmd === 'dot') out.push({ k: cmd, a: group() });
        else if (cmd === 'int' || cmd === 'sum' || cmd === 'prod' || cmd === 'lim' || cmd === 'oint') {
          const n = { k: cmd, lo: null, hi: null };
          for (let t = 0; t < 2; t++) { if (s[i] === '_') { i++; n.lo = group(); } else if (s[i] === '^') { i++; n.hi = group(); } }
          out.push(n);
        } else if (cmd === ' ') txt += ' ';
      } else if (c === '^' || c === '_') { i++; flush(); out.push({ k: c, a: group() }); }
      else { txt += c; i++; }
    }
    flush(); return out;
  }
  return seq(undefined);
}

// layout: returns a box {w, a, d, paint(ctx, x, y)} with y the baseline
function fLayout(ctx, items, size) {
  const boxes = [];
  for (const it of items) {
    if (typeof it === 'string') {
      ctx.font = `600 ${size}px ${FONT}`;
      const w = ctx.measureText(it).width;
      boxes.push({ w, a: size * .72, d: size * .22, paint: (c, x, y) => { c.font = `600 ${size}px ${FONT}`; c.fillText(it, x, y); } });
    } else if (it.k === '^' || it.k === '_') {
      const sub = fLayout(ctx, it.a, size * .62), up = it.k === '^' ? size * .42 : -size * .22;
      boxes.push({ w: sub.w + size * .05, a: Math.max(0, sub.a + up), d: Math.max(0, sub.d - up), paint: (c, x, y) => sub.paint(c, x + size * .03, y - up) });
    } else if (it.k === 'frac') {
      const A = fLayout(ctx, it.a, size * .82), B = fLayout(ctx, it.b, size * .82), w = Math.max(A.w, B.w) + size * .3, ax = size * .3, g = size * .14;
      boxes.push({ w: w + size * .1, a: ax + g + A.d + A.a, d: -ax + g + B.a + B.d, paint: (c, x, y) => {
        A.paint(c, x + (w - A.w) / 2 + size * .05, y - ax - g - A.d);
        B.paint(c, x + (w - B.w) / 2 + size * .05, y - ax + g + B.a);
        c.lineWidth = size * .065; c.beginPath(); c.moveTo(x + size * .05, y - ax); c.lineTo(x + w + size * .05, y - ax + size * .02); c.stroke();
      } });
    } else if (it.k === 'sqrt') {
      const A = fLayout(ctx, it.a, size), lead = size * .55;
      boxes.push({ w: A.w + lead + size * .1, a: A.a + size * .18, d: A.d, paint: (c, x, y) => {
        c.lineWidth = size * .065; c.beginPath();
        c.moveTo(x, y - size * .3); c.lineTo(x + lead * .3, y - size * .4); c.lineTo(x + lead * .55, y + A.d * .6); c.lineTo(x + lead * .9, y - A.a - size * .12); c.lineTo(x + lead + A.w + size * .05, y - A.a - size * .14);
        c.stroke(); A.paint(c, x + lead, y);
      } });
    } else if (it.k === 'bar' || it.k === 'dot') {
      const A = fLayout(ctx, it.a, size);
      boxes.push({ w: A.w, a: A.a + size * .2, d: A.d, paint: (c, x, y) => {
        A.paint(c, x, y);
        if (it.k === 'bar') { c.lineWidth = size * .06; c.beginPath(); c.moveTo(x + size * .05, y - A.a - size * .1); c.lineTo(x + A.w, y - A.a - size * .1); c.stroke(); }
        else { c.beginPath(); c.arc(x + A.w * .55, y - A.a - size * .14, size * .06, 0, 7); c.fill(); }
      } });
    } else if (it.k === 'int' || it.k === 'oint') {
      const lo = it.lo ? fLayout(ctx, it.lo, size * .5) : null, hi = it.hi ? fLayout(ctx, it.hi, size * .5) : null;
      const sw = size * .55, lw = Math.max(lo ? lo.w : 0, hi ? hi.w : 0);
      boxes.push({ w: sw + lw + size * .15, a: size * 1.1, d: size * .55, paint: (c, x, y) => {
        c.lineWidth = size * .07; c.beginPath();
        const top = y - size * 1.05, bot = y + size * .5, mx = x + sw * .5;
        c.moveTo(mx + sw * .35, top + size * .12); c.quadraticCurveTo(mx + sw * .2, top - size * .05, mx + sw * .05, top + size * .2);
        c.lineTo(mx - sw * .05, bot - size * .2); c.quadraticCurveTo(mx - sw * .2, bot + size * .05, mx - sw * .35, bot - size * .12); c.stroke();
        if (it.k === 'oint') { c.beginPath(); c.ellipse(mx, y - size * .27, size * .16, size * .12, 0, 0, 7); c.stroke(); }
        if (hi) hi.paint(c, x + sw + size * .02, top + size * .15);
        if (lo) lo.paint(c, x + sw - size * .12, bot + size * .05);
      } });
    } else if (it.k === 'sum' || it.k === 'prod' || it.k === 'lim') {
      const lo = it.lo ? fLayout(ctx, it.lo, size * .5) : null, hi = it.hi ? fLayout(ctx, it.hi, size * .5) : null;
      ctx.font = `600 ${size}px ${FONT}`;
      const core = it.k !== 'lim' ? size * .95 : ctx.measureText('lim').width;
      const w = Math.max(core, lo ? lo.w : 0, hi ? hi.w : 0) + size * .15;
      boxes.push({ w, a: size * (it.k !== 'lim' ? 1.1 : .75) + (hi ? size * .45 : 0), d: size * .3 + (lo ? size * .5 : 0), paint: (c, x, y) => {
        const cx = x + w / 2;
        if (it.k !== 'lim') {
          c.lineWidth = size * .07; c.beginPath();
          const t = y - size * .9, b = y + size * .2, l = cx - core * .42, r = cx + core * .42;
          if (it.k === 'sum') { c.moveTo(r, t + size * .08); c.lineTo(r, t); c.lineTo(l, t); c.lineTo(cx + core * .02, (t + b) / 2); c.lineTo(l, b); c.lineTo(r, b); c.lineTo(r, b - size * .08); }
          else { c.moveTo(l - size * .06, t); c.lineTo(r + size * .06, t); c.moveTo(l + size * .08, t); c.lineTo(l + size * .08, b); c.moveTo(r - size * .08, t); c.lineTo(r - size * .08, b); }
          c.stroke();
          if (hi) hi.paint(c, cx - hi.w / 2, t - size * .1);
          if (lo) lo.paint(c, cx - lo.w / 2, b + size * .45);
        } else {
          c.font = `600 ${size}px ${FONT}`; c.fillText('lim', cx - core / 2, y);
          if (lo) lo.paint(c, cx - lo.w / 2, y + size * .5);
        }
      } });
    }
  }
  let w = 0, a = 0, d = 0; const gap = size * .04;
  for (const b of boxes) { w += b.w + gap; a = Math.max(a, b.a); d = Math.max(d, b.d); }
  return { w, a, d, paint: (c, x, y) => { let xx = x; for (const b of boxes) { b.paint(c, xx, y); xx += b.w + gap; } } };
}

const FORMULAS = [
  'e^{iπ} + 1 = 0',
  '\\int_{−∞}^{∞} e^{−x²} dx = \\sqrt{π}',
  'P(A | B) = \\frac{P(B | A) P(A)}{P(B)}',
  'a² + b² = c²',
  '∇ · E = \\frac{ρ}{ε_0}',
  'V(x) = max_a { u(x,a) + β V(x′) }',
  '\\frac{∂x_i}{∂p_j} = \\frac{∂h_i}{∂p_j} − x_j \\frac{∂x_i}{∂w}',
  'u_i(s_i^*, s_{−i}^*) ≥ u_i(s_i, s_{−i}^*)',
  '\\sum_{n=1}^{∞} \\frac{1}{n²} = \\frac{π²}{6}',
  '\\lim_{n→∞} (1 + \\frac{1}{n})^n = e',
  'det(A − λI) = 0',
  'x = \\frac{−b ± \\sqrt{b² − 4ac}}{2a}',
  'Var(X) = E[X²] − E[X]²',
  'φ = \\frac{1 + \\sqrt{5}}{2}',
  '\\dot{x}_i = x_i ( f_i − \\bar{f} )',
  '\\frac{∂u}{∂t} = α \\frac{∂²u}{∂x²}',
  'E = mc²',
  'f(x) = \\sum_{n=0}^{∞} a_n cos(nx)',
  'ζ(s) = \\sum_{n=1}^{∞} \\frac{1}{n^s}',
  'e^x = \\sum_{k=0}^{∞} \\frac{x^k}{k!}',
  '\\oint_C F · dr = 0',
  'max_x u(x)  s.t.  p · x ≤ w',
  'Γ(n) = (n − 1)!',
  'π(p) = (p − c) q(p)',
  'σ² = \\frac{1}{n} \\sum_{i}^{} (x_i − \\bar{x})²',
  'β_{OLS} = (X′X)^{−1} X′y'
];
const NOTES = ['Lemma 2', 'Proof.', '∎', 'Q.E.D.', 'N.B.', 'Thm. 1', 'cf. Nash 1950', '?', 'hence', 'w.l.o.g.', 'Exercise 3', 'by induction', 'iff', '(★)', 'see notes'];
const BOARDS = [
  { name: 'green', c: '#2f4a3b' }, { name: 'deep green', c: '#22382c' }, { name: 'slate', c: '#2a3035' },
  { name: 'black', c: '#1f2324' }, { name: 'blue-green', c: '#244341' }
];
const CHALK = '#f1efe4', ACCENTS = ['#f3e19a', '#f2a7b6', '#a9d0f0', '#b9e3a8'];

function chalkify(c, rnd, n) {
  // knock tiny holes into the chalk so it reads as dry and grainy
  c.save(); c.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < n; i++) { c.fillStyle = `rgba(0,0,0,${.25 + rnd() * .5})`; const s = .6 + rnd() * 1.8; c.fillRect(rnd() * W, rnd() * H, s, s); }
  c.restore();
}

// ---------- diagrams (all drawn around their own top-left corner, size ~ w × h) ----------
function axes(c, x, y, w, h, lx, ly) {
  c.beginPath(); c.moveTo(x, y); c.lineTo(x, y + h); c.lineTo(x + w, y + h); c.stroke();
  c.beginPath(); c.moveTo(x - 6, y + 10); c.lineTo(x, y); c.lineTo(x + 6, y + 10); c.moveTo(x + w - 10, y + h - 6); c.lineTo(x + w, y + h); c.lineTo(x + w - 10, y + h + 6); c.stroke();
  c.font = `600 22px ${FONT}`; c.fillText(ly, x - 24, y + 14); c.fillText(lx, x + w - 8, y + h + 26);
}
const DIAGRAMS = {
  'supply and demand': (c, x, y, w, h, rnd) => {
    axes(c, x + 20, y, w - 20, h - 24, 'Q', 'P');
    c.beginPath(); c.moveTo(x + 40, y + 20); c.quadraticCurveTo(x + w * .5, y + h * .55, x + w - 20, y + h - 50); c.stroke();
    c.beginPath(); c.moveTo(x + 40, y + h - 50); c.quadraticCurveTo(x + w * .5, y + h * .45, x + w - 20, y + 20); c.stroke();
    c.setLineDash([6, 8]); c.beginPath(); c.moveTo(x + 20, y + h * .44); c.lineTo(x + w * .53, y + h * .44); c.lineTo(x + w * .53, y + h - 24); c.stroke(); c.setLineDash([]);
    c.font = `600 22px ${FONT}`; c.fillText('S', x + w - 22, y + 16); c.fillText('D', x + w - 18, y + h - 54); c.fillText('p*', x - 8, y + h * .44 + 6);
  },
  'unit circle': (c, x, y, w, h) => {
    const r = Math.min(w, h) * .4, cx = x + w / 2, cy = y + h / 2, th = .75;
    c.beginPath(); c.moveTo(cx - r - 20, cy); c.lineTo(cx + r + 20, cy); c.moveTo(cx, cy + r + 20); c.lineTo(cx, cy - r - 20); c.stroke();
    c.beginPath(); c.arc(cx, cy, r, 0, 7); c.stroke();
    const px = cx + r * Math.cos(th), py = cy - r * Math.sin(th);
    c.beginPath(); c.moveTo(cx, cy); c.lineTo(px, py); c.stroke();
    c.setLineDash([5, 7]); c.beginPath(); c.moveTo(px, py); c.lineTo(px, cy); c.stroke(); c.setLineDash([]);
    c.beginPath(); c.arc(cx, cy, r * .28, -th, 0); c.stroke();
    c.font = `600 22px ${FONT}`; c.fillText('θ', cx + r * .3, cy - 6); c.fillText('cos θ', cx + r * .15, cy + 26); c.fillText('sin θ', px + 6, (py + cy) / 2 + 6);
  },
  'game tree': (c, x, y, w, h, rnd) => {
    const top = [x + w / 2, y + 16], l = [x + w * .25, y + h * .5], r = [x + w * .75, y + h * .5];
    const leaves = [[x + w * .1, y + h - 30], [x + w * .38, y + h - 30], [x + w * .62, y + h - 30], [x + w * .9, y + h - 30]];
    c.beginPath(); c.moveTo(...top); c.lineTo(...l); c.moveTo(...top); c.lineTo(...r);
    c.moveTo(...l); c.lineTo(...leaves[0]); c.moveTo(...l); c.lineTo(...leaves[1]); c.moveTo(...r); c.lineTo(...leaves[2]); c.moveTo(...r); c.lineTo(...leaves[3]); c.stroke();
    for (const p of [top, l, r]) { c.beginPath(); c.arc(p[0], p[1], 5, 0, 7); c.fill(); }
    c.font = `600 20px ${FONT}`;
    c.fillText('1', top[0] + 10, top[1] + 4); c.fillText('2', l[0] - 22, l[1] + 4); c.fillText('2', r[0] + 10, r[1] + 4);
    c.fillText('L', (top[0] + l[0]) / 2 - 20, (top[1] + l[1]) / 2); c.fillText('R', (top[0] + r[0]) / 2 + 10, (top[1] + r[1]) / 2);
    const pays = ['(3,1)', '(0,0)', '(1,2)', '(2,3)'];
    leaves.forEach((p, i) => c.fillText(pays[(i + Math.floor(rnd() * 4)) % 4], p[0] - 22, p[1] + 26));
  },
  'payoff matrix': (c, x, y, w, h) => {
    const gx = x + 50, gy = y + 40, cw = (w - 60) / 2, chh = (h - 50) / 2;
    c.strokeRect(gx, gy, cw * 2, chh * 2); c.beginPath(); c.moveTo(gx + cw, gy); c.lineTo(gx + cw, gy + chh * 2); c.moveTo(gx, gy + chh); c.lineTo(gx + cw * 2, gy + chh); c.stroke();
    c.font = `600 22px ${FONT}`;
    c.fillText('C', gx + cw * .45, gy - 10); c.fillText('D', gx + cw * 1.45, gy - 10); c.fillText('C', gx - 26, gy + chh * .6); c.fillText('D', gx - 26, gy + chh * 1.6);
    const v = [['3, 3', '0, 5'], ['5, 0', '1, 1']];
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) c.fillText(v[i][j], gx + cw * j + cw * .2, gy + chh * i + chh * .6);
  },
  'bell curve': (c, x, y, w, h) => {
    axes(c, x + 10, y + 10, w - 20, h - 34, 'x', '');
    c.beginPath();
    for (let i = 0; i <= 60; i++) { const t = i / 60, u = (t - .5) * 6, px = x + 14 + t * (w - 30), py = y + h - 26 - Math.exp(-u * u / 2) * (h - 60); i ? c.lineTo(px, py) : c.moveTo(px, py); }
    c.stroke();
    c.setLineDash([5, 7]); c.beginPath(); c.moveTo(x + w / 2, y + 30); c.lineTo(x + w / 2, y + h - 24); c.stroke(); c.setLineDash([]);
    c.font = `600 22px ${FONT}`; c.fillText('μ', x + w / 2 - 6, y + h + 2);
  },
  'right triangle': (c, x, y, w, h) => {
    const A = [x + 20, y + h - 20], B = [x + w - 20, y + h - 20], C = [x + w - 20, y + 20];

// ---------- placement helpers ----------
function toTop(g) { G.order = G.order.filter(id => id !== g.id); G.order.push(g.id); }

function bump(h) { h.slotted = false; const [x, y] = placeOnTable(h, ...randomTableSpot()); moveTo(h, x, y, 420); toTop(h); }

// ---------- scatter ----------
function scatter(fresh) {

  const n = loose.length; if (!n) return;
  const rnd = mulberry32((Math.random() * 1e9) | 0);

// ---------- interaction ----------
function at(e) { const r = cvs.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
